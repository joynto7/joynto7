<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title">
  <title id="title">Joynto Ghosh — Full-stack engineer · AI security</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="24"/></clipPath>
    <radialGradient id="glow-teal" gradientUnits="userSpaceOnUse" cx="120" cy="440" r="520">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" gradientUnits="userSpaceOnUse" cx="1110" cy="-70" r="520">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-rose" gradientUnits="userSpaceOnUse" cx="930" cy="200" r="220">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" gradientUnits="userSpaceOnUse" cx="930" cy="200" r="84">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0f172a" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="dots-fade" gradientUnits="userSpaceOnUse" cx="930" cy="200" r="330">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dots-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400">
      <rect width="1200" height="400" fill="url(#dots-fade)"/>
    </mask>
    <linearGradient id="name-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.25" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="chip-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    .blink { animation: blink 1.4s steps(1) infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.4); opacity: 0; } }
    @keyframes breathe { 50% { opacity: 0.5; } }
    @keyframes blink { 50% { opacity: 0.2; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#f8fafc"/>
    <rect width="1200" height="400" fill="url(#glow-teal)"/>
    <rect width="1200" height="400" fill="url(#glow-violet)"/>
    <rect width="1200" height="400" fill="url(#glow-rose)"/>
    <rect width="1200" height="400" fill="url(#dots)" mask="url(#dots-mask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#0f172a" stroke-opacity="0.1"/>

  <!-- Who -->
  <g transform="translate(64 92)">
    <rect width="372" height="36" rx="18" fill="#14b8a6" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.35"/>
    <circle cx="22" cy="18" r="4.5" fill="#10b981"/>
    <circle class="pulse" cx="22" cy="18" r="4.5" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="23" class="mono" font-size="15" fill="#0f766e">Open to internships &amp; junior roles</text>
  </g>
  <text x="60" y="214" class="sans" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#name-fill)">Joynto Ghosh</text>
  <text x="64" y="264" class="sans" font-size="30" font-weight="600" fill="url(#accent)">Full-stack engineer · AI security</text>
  <text x="64" y="306" class="sans" font-size="19" fill="#475569">Building LLM-powered apps — and red-teaming them</text>

  <!-- Red-team radar around an LLM app: outer ring = attack surface, inner ring = guardrails -->
  <g fill="none">
    <circle cx="930" cy="200" r="148" stroke="#e11d48" stroke-opacity="0.30" stroke-width="1.2"/>
    <circle cx="930" cy="200" r="102" stroke="#0f172a" stroke-opacity="0.12" stroke-dasharray="2 6"/>
    <path d="M930 52 V348 M782 200 H1078" stroke="#0f172a" stroke-opacity="0.06"/>
    <path d="M1078 200 H1086 M1058.17 274 L1065.1 278 M1004 328.17 L1008 335.1 M930 348 V356 M856 328.17 L852 335.1 M801.83 274 L794.9 278 M782 200 H774 M801.83 126 L794.9 122 M856 71.83 L852 64.9 M930 52 V44 M1004 71.83 L1008 64.9 M1058.17 126 L1065.1 122" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 930 200" to="360 930 200" dur="6s" repeatCount="indefinite"/>
    <path d="M930 200 L1078 200 A148 148 0 0 0 1075.75 174.3 Z" fill="#f43f5e" fill-opacity="0.22"/>
    <path d="M930 200 L1075.75 174.3 A148 148 0 0 0 1069.07 149.38 Z" fill="#f43f5e" fill-opacity="0.15"/>
    <path d="M930 200 L1069.07 149.38 A148 148 0 0 0 1058.17 126 Z" fill="#f43f5e" fill-opacity="0.10"/>
    <path d="M930 200 L1058.17 126 A148 148 0 0 0 1043.37 104.87 Z" fill="#f43f5e" fill-opacity="0.065"/>
    <path d="M930 200 L1043.37 104.87 A148 148 0 0 0 1025.13 86.63 Z" fill="#f43f5e" fill-opacity="0.035"/>
    <path d="M930 200 L1025.13 86.63 A148 148 0 0 0 1004 71.83 Z" fill="#f43f5e" fill-opacity="0.018"/>
    <path d="M930 200 H1078" stroke="#e11d48" stroke-width="2" stroke-opacity="0.85"/>
  </g>

  <path d="M930 200 L857.9 127.9 M930 200 L1002.1 127.9 M930 200 V302" fill="none" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Attack probes, blocked at the guardrail ring -->
  <g>
    <circle r="3" fill="#e11d48" opacity="0">
      <animateMotion dur="3s" begin="-0.4s" repeatCount="indefinite" path="M1072.96 161.69 L989.89 183.95" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.78;0.8;1" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="989.89" cy="183.95" r="3" fill="none" stroke="#0d9488" stroke-width="2" opacity="0">
      <animate attributeName="r" values="3;3;9;12" keyTimes="0;0.79;0.88;1" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.79;0.84;1" dur="3s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#e11d48" opacity="0">
      <animateMotion dur="3s" begin="-1.9s" repeatCount="indefinite" path="M787.04 238.31 L870.11 216.05" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.78;0.8;1" dur="3s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870.11" cy="216.05" r="3" fill="none" stroke="#0d9488" stroke-width="2" opacity="0">
      <animate attributeName="r" values="3;3;9;12" keyTimes="0;0.79;0.88;1" dur="3s" begin="-1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.79;0.84;1" dur="3s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="930" cy="200" r="60" fill="none" stroke="#0d9488" stroke-width="2" stroke-opacity="0.9" filter="url(#glow)"/>
  <circle cx="930" cy="200" r="60" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" stroke-opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 930 200" to="-360 930 200" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- The model -->
  <circle class="breathe" cx="930" cy="200" r="84" fill="url(#core-glow)"/>
  <path d="M910 161 V167 M922 161 V167 M938 161 V167 M950 161 V167 M910 233 V239 M922 233 V239 M938 233 V239 M950 233 V239 M891 180 H897 M891 192 H897 M891 208 H897 M891 220 H897 M963 180 H969 M963 192 H969 M963 208 H969 M963 220 H969" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
  <rect x="898" y="168" width="64" height="64" rx="14" fill="url(#chip-fill)" stroke="#7c3aed" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="930" y="206.5" class="mono" font-size="18" font-weight="700" text-anchor="middle" fill="#f5f3ff">LLM</text>

  <g class="mono" font-size="12" text-anchor="middle">
    <rect x="828.9" y="115.9" width="58" height="24" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="857.9" y="132" fill="#5b21b6">RAG</text>
    <rect x="973.1" y="115.9" width="58" height="24" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="1002.1" y="132" fill="#5b21b6">agents</text>
    <rect x="901" y="290" width="58" height="24" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="930" y="306" fill="#5b21b6">tools</text>
  </g>

  <!-- Findings light up as the sweep passes them -->
  <g class="mono" font-size="13">
    <circle cx="1072.96" cy="238.31" r="4" fill="#e11d48" opacity="0.35">
      <animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="6s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1072.96" cy="238.31" r="4" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4;16;16" keyTimes="0;0.25;1" dur="6s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.25;1" dur="6s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
    <text x="1085" y="242.5" fill="#be123c" opacity="0.6">tool misuse<animate attributeName="opacity" values="1;0.6;0.6" keyTimes="0;0.35;1" dur="6s" begin="0.25s" repeatCount="indefinite"/></text>

    <circle cx="825.35" cy="304.65" r="4" fill="#e11d48" opacity="0.35">
      <animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="6s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="825.35" cy="304.65" r="4" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4;16;16" keyTimes="0;0.25;1" dur="6s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.25;1" dur="6s" begin="2.25s" repeatCount="indefinite"/>
    </circle>
    <text x="813" y="309" text-anchor="end" fill="#be123c" opacity="0.6">data leakage<animate attributeName="opacity" values="1;0.6;0.6" keyTimes="0;0.35;1" dur="6s" begin="2.25s" repeatCount="indefinite"/></text>

    <circle cx="782.56" cy="187.1" r="4" fill="#e11d48" opacity="0.35">
      <animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="6s" begin="3.083s" repeatCount="indefinite"/>
    </circle>
    <circle cx="782.56" cy="187.1" r="4" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4;16;16" keyTimes="0;0.25;1" dur="6s" begin="3.083s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.25;1" dur="6s" begin="3.083s" repeatCount="indefinite"/>
    </circle>
    <text x="770" y="191.5" text-anchor="end" fill="#be123c" opacity="0.6">jailbreak<animate attributeName="opacity" values="1;0.6;0.6" keyTimes="0;0.35;1" dur="6s" begin="3.083s" repeatCount="indefinite"/></text>

    <circle cx="968.31" cy="57.04" r="4" fill="#e11d48" opacity="0.35">
      <animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="6s" begin="4.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="968.31" cy="57.04" r="4" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="4;16;16" keyTimes="0;0.25;1" dur="6s" begin="4.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.25;1" dur="6s" begin="4.75s" repeatCount="indefinite"/>
    </circle>
    <text x="981" y="61.5" fill="#be123c" opacity="0.6">prompt injection<animate attributeName="opacity" values="1;0.6;0.6" keyTimes="0;0.35;1" dur="6s" begin="4.75s" repeatCount="indefinite"/></text>
  </g>

  <g class="mono" font-size="12">
    <circle class="blink" cx="836" cy="380" r="3.5" fill="#e11d48"/>
    <text x="846" y="384" fill="#64748b">sentra · red-team scan</text>
  </g>
</svg>
