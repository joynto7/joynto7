<svg xmlns="http://www.w3.org/2000/svg" width="224" height="100" viewBox="71 440 224 100" preserveAspectRatio="none" role="img" aria-label="View My Projects">
<title>View My Projects</title>
<defs>
<linearGradient id="space" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="2336"><stop offset="0" stop-color="#050817"/><stop offset="0.33" stop-color="#080c23"/><stop offset="0.67" stop-color="#070a1d"/><stop offset="1" stop-color="#04060f"/></linearGradient>
<radialGradient id="nebula-1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.22"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
<linearGradient id="edge-hero" gradientUnits="userSpaceOnUse" x1="36" y1="116" x2="576" y2="656"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1637"/><stop offset="1" stop-color="#090d25"/></linearGradient>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/></pattern>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="304.51" y1="0" x2="431.95" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
