<text x="78" y="184" class="sans" font-size="22" fill="#c7d2fe">Hi, I'm</text>
<text x="75" y="256" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="#f8fafc">Joynto<tspan fill="url(#name)">Dev</tspan></text>
<text x="78" y="298" class="sans" font-size="16" fill="#d6def0">Full-stack Developer<tspan fill="#22d3ee">  •  </tspan>AI Enthusiast<tspan fill="#22d3ee">  •  </tspan>Problem Solver</text>
<text x="78" y="340" class="sans" font-size="16.5" fill="#b6c0dc">I build modern web applications, AI-powered tools, and</text>
<text x="78" y="366" class="sans" font-size="16.5" fill="#b6c0dc">scalable systems that solve real-world problems. Here's a</text>
<text x="78" y="392" class="sans" font-size="16.5" fill="#b6c0dc">collection of my featured work and projects I've built along</text>
<text x="78" y="418" class="sans" font-size="16.5" fill="#b6c0dc">the way.</text>
