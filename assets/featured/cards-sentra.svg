<svg xmlns="http://www.w3.org/2000/svg" width="306" height="390" viewBox="0 784 306 390" preserveAspectRatio="none" role="img" aria-label="Sentra — AI Security Testing Platform. Tests LLM apps such as chatbots, RAG systems and tool-using agents: maps the attack surface, runs security tests, records evidence, scores risk, and re-tests after fixes. Built with Next.js, TypeScript, FastAPI, PostgreSQL, Celery + Redis, LiteLLM, Docker.">
<title>Sentra — AI Security Testing Platform. Tests LLM apps such as chatbots, RAG systems and tool-using agents: maps the attack surface, runs security tests, records evidence, scores risk, and re-tests after fixes. Built with Next.js, TypeScript, FastAPI, PostgreSQL, Celery + Redis, LiteLLM, Docker.</title>
