<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <defs>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="1"/><stop offset="1" stop-color="#a78bfa" stop-opacity="1"/></linearGradient>
  </defs>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.hand { font-family: "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive; }
.float { animation: float 7s ease-in-out infinite; }
.lift { transform-box: fill-box; transform-origin: center; animation: lift 6s ease-in-out infinite; }
.bob { animation: bob 5s ease-in-out infinite; }
.bob2 { animation: bob 7.5s ease-in-out infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes lift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(0, -7px) rotate(-0.8deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect x="2" y="22" width="4" height="54" rx="2" fill="url(#bar)"/>
<text x="22" y="50" class="sans" font-size="27" font-weight="700" letter-spacing="-0.3" fill="#f8fafc">Tech Stack</text>
<text x="22" y="76" class="sans" font-size="15.5" fill="#aeb8cc">Technologies I work with.</text>
</svg>
