<svg xmlns="http://www.w3.org/2000/svg" width="294" height="390" viewBox="306 784 294 390" preserveAspectRatio="none" role="img" aria-label="AgroSync — Smart Irrigation Dashboard. Streams soil moisture and temperature from ESP32 sensors, lets users start watering remotely, and stores history in PostgreSQL for trend charts. Built with ESP32, MQTT, Socket.IO, Next.js, Express, Prisma, PostgreSQL.">
<title>AgroSync — Smart Irrigation Dashboard. Streams soil moisture and temperature from ESP32 sensors, lets users start watering remotely, and stores history in PostgreSQL for trend charts. Built with ESP32, MQTT, Socket.IO, Next.js, Express, Prisma, PostgreSQL.</title>
