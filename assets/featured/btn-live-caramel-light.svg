<svg xmlns="http://www.w3.org/2000/svg" width="135" height="64" viewBox="0 0 135 64" role="img" aria-label="Live demo">
  <title>Live demo</title>
  <defs>
<linearGradient id="fill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f4e37" stop-opacity="1"/><stop offset="1" stop-color="#c28a58" stop-opacity="1"/></linearGradient>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
  </defs>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.hand { font-family: "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive; }
.float { animation: float 7s ease-in-out infinite; }
.lift { transform-box: fill-box; transform-origin: center; animation: lift 6s ease-in-out infinite; }
.bob { animation: bob 5s ease-in-out infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes lift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(0, -7px) rotate(-0.8deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect class="pulse" x="1.5" y="9.5" width="132" height="37" rx="11" fill="none" stroke="#c28a58" stroke-width="3" stroke-opacity="0.48"/>
<rect x="3" y="11" width="129" height="34" rx="9" fill="url(#fill)"/>
<path d="M12 12 H123" stroke="#ffffff" stroke-opacity="0.35" stroke-linecap="round"/>
<text x="18" y="33" class="sans" font-size="14.5" font-weight="600" fill="#ffffff">Live demo</text>
<use href="#i-arrow" x="102" y="20.5" width="15" height="15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
