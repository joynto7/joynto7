<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-label="FEATURED WORK: Selected Projects">
  <title>FEATURED WORK: Selected Projects</title>
  <defs>
<linearGradient id="chev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="1"/><stop offset="1" stop-color="#a78bfa" stop-opacity="1"/></linearGradient>
<linearGradient id="word" gradientUnits="userSpaceOnUse" x1="207.13" y1="0" x2="393.35" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.hand { font-family: "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive; }
.float { animation: float 7s ease-in-out infinite; }
.lift { transform-box: fill-box; transform-origin: center; animation: lift 6s ease-in-out infinite; }
.bob { animation: bob 5s ease-in-out infinite; }
.bob2 { animation: bob 7.5s ease-in-out infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes lift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(0, -7px) rotate(-0.8deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<path d="M14 26 L4 37 L14 48 M26 26 L36 37 L26 48" fill="none" stroke="url(#chev)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="42" class="sans" font-size="13.5" font-weight="700" letter-spacing="3" fill="#22d3ee">FEATURED WORK</text>
<text x="0" y="98" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#f8fafc">Selected <tspan fill="url(#word)">Projects</tspan></text>
<text x="2" y="132" class="sans" font-size="17" fill="#93c5fd" data-max="580">Real-world solutions built with modern technologies, from idea to</text>
<text x="2" y="156" class="sans" font-size="17" fill="#93c5fd" data-max="580">deployment.</text>
</svg>
