<radialGradient id="nebula-0" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.36"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="nebula-1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.22"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
<linearGradient id="navEdge" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="1180" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="navFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111a3d"/><stop offset="1" stop-color="#0a0f28"/></linearGradient>
