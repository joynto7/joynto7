<svg xmlns="http://www.w3.org/2000/svg" width="732" height="100" viewBox="0 0 732 100" preserveAspectRatio="none" role="img" aria-label="JoyntoDev — portfolio">
<title>JoyntoDev — portfolio</title>
<defs>
