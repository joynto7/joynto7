<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="01 Featured Projects — Selected work that defines my journey.">
  <title>01 Featured Projects — Selected work that defines my journey.</title>
  <defs>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="1"/><stop offset="1" stop-color="#7c3aed" stop-opacity="1"/></linearGradient>
<linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="1"/><stop offset="1" stop-color="#7c3aed" stop-opacity="1"/></linearGradient>

  </defs>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.hand { font-family: "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive; }
.float { animation: float 7s ease-in-out infinite; }
.lift { transform-box: fill-box; transform-origin: center; animation: lift 6s ease-in-out infinite; }
.bob { animation: bob 5s ease-in-out infinite; }
.pulse { animation: pulse 3.2s ease-in-out infinite; }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes lift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(0, -7px) rotate(-0.8deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

<rect x="35" y="88" width="2" height="16" fill="url(#rail)" fill-opacity="0.45"/>
<circle class="pulse" cx="36" cy="60" r="31" fill="none" stroke="#2563eb" stroke-opacity="0.35" stroke-width="5"/>
<circle cx="36" cy="60" r="24" fill="#ffffff" stroke="url(#ringStroke)" stroke-width="2"/>
<text x="36" y="65.3" class="sans" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">01</text>
<text x="96" y="56" class="sans" font-size="26" font-weight="700" letter-spacing="-0.3" fill="#0f172a">Featured Projects</text>
<text x="96" y="82" class="sans" font-size="15.5" fill="#475569">Selected work that defines my journey.</text>


</svg>
